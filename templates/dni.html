<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annaba | Identificacion</title>
    <link rel="stylesheet" href="/static/css/dni.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
</head>
<body>
    <div class="logo-section">
        <img src="/static/image/anna-nofond.png" alt="Logo" id="logo">
        <h1>A N N A B A</h1>
    </div>

    <div class="main-container">
        <div class="form-container">
            <form>
                <div class="form-row">
                    <div class="form-section large">
                        <label for="country"><i class="fas fa-flag"></i> Country</label>
                        <select id="country" class="select-input">
                            <option value="Argentina">Argentina</option>
                            <option value="El Salvador">El Salvador</option>
                            <option value="Peru">Peru</option>
                            <option value="Ecuador">Ecuador</option>
                            <option value="Chile">Chile</option>
                            <option value="Costa Rica">Costa Rica</option>
                        </select>
                    </div>
                    <div class="form-section medium">
                        <label for="city"><i class="fas fa-city"></i> City</label>
                        <select id="city" class="select-input">
                            <option value="Buenos Aires">Buenos Aires</option>
                            <option value="San Salvador">San Salvador</option>
                            <option value="Lima">Lima</option>
                            <option value="Quito">Quito</option>
                            <option value="Santiago de Chile">Santiago de Chile</option>
                            <option value="San Jose">San Jose</option>
                        </select>
                    </div>
                    <div class="form-section small">
                        <label for="docType"><i class="fas fa-id-card"></i> Tipo de Documento</label>
                        <select id="docType" class="select-input">
                            <option value="ID Card">DNI</option>
                        </select>
                    </div>
                    <div class="form-section small">
                        <label for="revision"><i class="fas fa-history"></i>Ubigueo</label>
                        <input type="text" id="revision">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-section medium">
                        <label for="firstName"><i class="fas fa-user"></i> Nombre</label>
                        <input type="text" id="firstName">
                    </div>
                    <div class="form-section medium">
                        <label for="middleName"><i class="fas fa-user"></i>Primer Apellido</label>
                        <input type="text" id="middleName">
                    </div>
                    <div class="form-section medium">
                        <label for="lastName"><i class="fas fa-user"></i>Segundo Apellido</label>
                        <input type="text" id="lastName">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-section medium">
                        <label for="birthday"><i class="fas fa-calendar-alt"></i> Fecha de Nacimiento</label>
                        <input type="date" id="birthday">
                    </div>
                    <div class="form-section medium">
                        <label for="issueDate"><i class="fas fa-calendar-check"></i> Fecha de Emision</label>
                        <input type="date" id="issueDate">
                    </div>
                    <div class="form-section medium">
                        <label for="expiryDate"><i class="fas fa-calendar-times"></i> Fecha de Vencimiento</label>
                        <input type="date" id="expiryDate">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-section small">
                        <label for="docNumber"><i class="fas fa-id-card"></i> Numero de Documento</label>
                        <input type="text" id="docNumber">
                    </div>
                    <div class="form-section small">
                        <label for="cuit"><i class="fas fa-info-circle"></i> Estado Civil</label>
                        <input type="text" id="cuit">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-section medium">
                        <label for="optionalData1"><i class="fas fa-info-circle"></i>Sexo</label>
                        <input type="text" id="optionalData1">
                    </div>
                    <div class="form-section medium">
                        <label for="dataInscrip"><i class="fas fa-calendar-times"></i>Fecha de Inscripcion</label>
                        <input type="date" id="dataInscrip">
                    </div>
                    <div class="link">
                        <span><a id="link_install" href="#" class="fas fa-download"></a> Link de descarga</span>
                    </div>
                </div>
            </form>
        </div>

        <div class="photo-section">
            <div class="photo-upload">
                <label for="photo"><i class="fas fa-camera"></i> Photo</label>
                <input type="file" id="photo" accept="image/*">
                <img id="photo-preview" alt="Preview Photo" style="display:none;">
            </div>

            <div class="signature-upload">
                <label for="signature"><i class="fas fa-signature"></i> Signature</label>
                <input type="file" id="signature" accept="image/*">
                <img id="signature-preview" alt="Preview Signature" style="display:none;">
            </div>

            <div class="fingerprint-upload">
                <label for="fingerprint"><i class="fas fa-fingerprint"></i> Huella</label>
                <input type="file" id="fingerprint" name="fingerprint" accept="image/*">
                <img id="fingerprint-preview" alt="Fingerprint Preview" style="display:none;">
            </div>
        </div>
    </div>

    <div class="button-section">
        <button type="button" id="save-btn" onclick="btn_information()">Generate Informacion</button>
        <button type="button" id="cancel-btn" onclick="btn_generate()">Generar Identificacion</button>
    </div>

    <script src="{{ url_for('static', filename='js/dni_script.js') }}"></script>
</body>
</html>
